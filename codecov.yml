# Each CI run uploads coverage 16 times: the core suite (Python 3.12) and the
# tests of each of the 15 dataset environments (.github/workflows/tests.yml).
# Report only once all of them have arrived, so a status computed from the
# first few uploads cannot fail the patch check. Adding a dataset job adds one.
codecov:
  notify:
    after_n_builds: 16
comment:
  after_n_builds: 16
