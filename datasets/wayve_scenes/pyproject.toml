[project]
name = "standard-e2e-wayve-scenes"
version = "0.0.0"
description = "Isolated preprocessing environment for WayveScenes101 (StandardE2E)."
requires-python = ">=3.12,<3.15"
dependencies = [
    "standard-e2e",
    # COLMAP's Python bindings, which the official WayveScenes SDK reads the
    # per-scene reconstructions with (the SDK itself cannot be installed; see
    # the README's known issues).
    "pycolmap>=4.2",
]

[dependency-groups]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[tool.uv]
package = false
# Preprocessing never imports PyTorch (only standard_e2e.training does), so
# StandardE2E's training-only dependencies stay out of this environment.
override-dependencies = [
    "torch; sys_platform == 'never'",
    "torchvision; sys_platform == 'never'",
]

[tool.uv.sources]
standard-e2e = { path = "../..", editable = true }
