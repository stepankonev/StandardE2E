[project]
name = "standard-e2e-navsim"
version = "0.0.0"
description = "Isolated preprocessing environment for NAVSIM (StandardE2E)."
requires-python = ">=3.12,<3.15"
dependencies = [
    "standard-e2e",
    # Motional's devkit, from its repository (source below). The PyPI
    # "nuplan-devkit" 2.0.0 is a third-party upload that runs an install-time
    # hook installing another repository: never depend on it.
    "nuplan-devkit",
    # nuplan-devkit declares no dependencies but imports these at runtime (its
    # map stack and S3 helpers), so they are listed here for it.
    "geopandas>=0.14",
    "pyogrio>=0.7",
    "rasterio>=1.3",
    "shapely>=2.0",
    "aioboto3>=15.5.0",
    "boto3>=1.40.61",
    "botocore>=1.40.61",
    "requests>=2.32.5",
    "retry>=0.9.2",
]

[dependency-groups]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0.0"]

[tool.uv]
package = false
# Preprocessing never imports PyTorch (only standard_e2e.training does), so
# StandardE2E's training-only dependencies stay out of this environment.
override-dependencies = [
    "torch; sys_platform == 'never'",
    "torchvision; sys_platform == 'never'",
]

[tool.uv.sources]
standard-e2e = { path = "../..", editable = true }
nuplan-devkit = { git = "https://github.com/motional/nuplan-devkit.git", rev = "ce3c323af01c0d7ec5672f7832ef53f9c679aab0" }  # tag nuplan-devkit-v1.2
