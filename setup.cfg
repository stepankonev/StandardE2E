[flake8]
max-line-length = 88
extend-ignore = E203, W503
exclude = 
    .git,
    __pycache__,
    .venv,
    .eggs,
    *.egg,
    build,
    dist,
    .tox,
    standard_e2e/third_party/
# These test modules skip themselves (pytest.importorskip) before importing a
# dataset SDK that only that dataset's environment provides.
per-file-ignores =
    tests/dataset_processors/test_av2_lidar_dataset_processor.py:E402
    tests/dataset_processors/test_av2_sensor_dataset_processor.py:E402
    tests/dataset_processors/test_kitscenes_multimodal_dataset_processor.py:E402
    tests/dataset_processors/test_natix_edgecase_dataset_processor.py:E402
    tests/dataset_processors/test_natix_multicam_dataset_processor.py:E402
    tests/dataset_processors/test_navsim_dataset_processor.py:E402
    tests/dataset_processors/test_waymo_e2e_dataset_processor.py:E402
    tests/dataset_processors/test_waymo_perception_dataset_processor.py:E402
    tests/test_waymo_lidar_numpy.py:E402
