name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-slim
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Ensure lockfile is up to date
      run: uv lock --check
      continue-on-error: false

    - name: Cache uv dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ matrix.python-version }}-${{ hashFiles('uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-uv-${{ matrix.python-version }}-
          ${{ runner.os }}-uv-

    - name: Install dependencies
      run: uv sync --all-extras --python ${{ matrix.python-version }}

    - name: Run tests
      run: uv run pytest tests/ -v --cov --cov-report=xml

    - name: Verify coverage file exists
      if: matrix.python-version == '3.12'
      run: |
        ls -la coverage.xml
        echo "Coverage file size: $(wc -c < coverage.xml) bytes"
        head -20 coverage.xml

    - name: Upload coverage to Codecov
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v5
      with:
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}

  # Each dataset's tests run in that dataset's own environment (datasets/<name>/),
  # the only place its SDK is installed; elsewhere they skip.
  datasets:
    name: Dataset tests (${{ matrix.dataset }})
    runs-on: ubuntu-slim
    strategy:
      fail-fast: false
      matrix:
        include:
          - dataset: waymo_e2e
            tests: tests/dataset_processors/test_waymo_e2e_dataset_processor.py
          - dataset: waymo_perception
            tests: tests/dataset_processors/test_waymo_perception_dataset_processor.py tests/test_waymo_lidar_numpy.py
          - dataset: av2_sensor
            tests: tests/dataset_processors/test_av2_sensor_dataset_processor.py
          - dataset: av2_lidar
            tests: tests/dataset_processors/test_av2_lidar_dataset_processor.py
          - dataset: navsim
            tests: tests/dataset_processors/test_navsim_dataset_processor.py
          - dataset: nuscenes
            tests: tests/dataset_processors/test_nuscenes_dataset_processor.py
          - dataset: wayve_scenes
            tests: tests/dataset_processors/test_wayve_scenes_dataset_processor.py tests/test_colmap_io.py
          - dataset: comma2k19
            tests: tests/dataset_processors/test_comma2k19_dataset_processor.py
          - dataset: truckdrive
            tests: tests/dataset_processors/test_truckdrive_dataset_processor.py
          - dataset: vod
            tests: tests/dataset_processors/test_vod_dataset_processor.py
          - dataset: kitscenes_multimodal
            tests: tests/dataset_processors/test_kitscenes_multimodal_dataset_processor.py
          - dataset: kitscenes_longtail
            tests: tests/dataset_processors/test_kitscenes_longtail_dataset_processor.py
          - dataset: natix_multicam
            tests: tests/dataset_processors/test_natix_multicam_dataset_processor.py
          - dataset: natix_edgecase
            tests: tests/dataset_processors/test_natix_edgecase_dataset_processor.py

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Ensure lockfile is up to date
      run: uv lock --check --project datasets/${{ matrix.dataset }}

    - name: Cache uv dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-uv-${{ matrix.dataset }}-${{ hashFiles(format('datasets/{0}/uv.lock', matrix.dataset)) }}
        restore-keys: |
          ${{ runner.os }}-uv-${{ matrix.dataset }}-

    - name: Install dependencies
      run: uv sync --locked --project datasets/${{ matrix.dataset }}

    - name: Run tests
      run: uv run --project datasets/${{ matrix.dataset }} python -m pytest ${{ matrix.tests }} -v --cov --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}

  lint:
    name: Code Quality
    runs-on: ubuntu-slim

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"

    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Cache uv dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/uv
        key: ${{ runner.os }}-lint-${{ hashFiles('uv.lock') }}
        restore-keys: |
          ${{ runner.os }}-lint-
          ${{ runner.os }}-uv-

    - name: Install dependencies
      run: uv sync --all-extras

    - name: Check code formatting (black)
      run: uv run black --check --diff standard_e2e/ tests/ --exclude="standard_e2e/third_party/"

    - name: Check import sorting (isort)
      run: uv run isort --check-only --diff standard_e2e/ tests/ --skip-glob="standard_e2e/third_party/*"

    - name: Lint code (flake8)
      run: uv run flake8 standard_e2e/ tests/ --max-line-length=88 --extend-ignore=E203,W503 --exclude=standard_e2e/third_party/

    - name: Type check (mypy)
      run: uv run mypy standard_e2e/

    - name: Validate dataset pipelines (stepix)
      run: for f in datasets/*/README.md; do uvx stepix validate "$f"; done
